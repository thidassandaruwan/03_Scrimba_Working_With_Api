<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
    <!-- css -->
    <link rel="stylesheet" href="styles.css">
    <!-- JS -->
    <script type="module" src="script.js" defer></script>
    <!-- favicon -->
    <link rel="icon" type="image/x-icon" href="./img/logo.svg">
    <title>Color Scheme Generator</title>
</head>
<body data-theme="light">
    <header class="header">
        <span id="logo-text">The Color Scheme</span>
        <button id="switch-theme-btn" class="button">Switch to Dark</button>
    </header>
    <main>
        <form id="control-bar">
            <input id="color-picker" name="color" type="color" value="#9a6a98" required>

            <select id="color-scheme-mode" name="mode" aria-label="Color Scheme Mode" required>
                <option value="monochrome" selected> Monochrome </option>
                <option value="monochrome-dark"> Monochrome Dark </option>
                <option value="monochrome-light"> Monochrome Light </option>
                <option value="analogic"> Analogic </option>
                <option value="complement"> Complement </option>
                <option value="analogic-complement"> Analogic Complement </option>
                <option value="triad"> Triad </option>
                <option value="quad"> Quad </option>
            </select>

            <button id="control-submit-btn" class="button" type="submit">Get Color Scheme</button>
        </form>

        <div id="color-samples">
        </div>
    </main>

    <footer class="footer">
        <p>Copyright &copy; <span id="copyright-year">2026</span> <a href="https://github.com/thidassandaruwan">Thidas</a>. All rights reserved.</p>
    </footer>
    
</body>
</html>
