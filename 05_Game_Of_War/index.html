<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Google fonts ("Cinzel Decorative", "Della Respira") -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Della+Respira&display=swap" rel="stylesheet">
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="./img/logo.png">
    <!-- CSS -->
    <link rel="stylesheet" href="styles.css">
    <!-- JS -->
     <script type="module" src="script.js" defer></script>
    <title>Game of War</title>
</head>
<body>
    <div class="top-row">
        <button id="restart-btn" class="cinzel-decorative" type="button">RESTART</button>
        <p id="remaining-cards" class="cinzel-decorative">REMAINING CARDS : <span id="card-number"> 0 </span></p>
    </div>
    <div class="title-row">
        <img src="img/game_of_war.png" alt="game of war logo">
    </div>
    <div class="game-content">
        <div class="participant">
            <div id="computer-card"> </div>
            <p class="participant-score della-respira">Computer : <span id="computer-score">0</span></p>
        </div>

        <div class="result">
            <p id="result-txt" class="cinzel-decorative">
                START THE WAR!
            </p>
        </div>

        <div class="participant">
            <div id="user-card"> </div>
            <p class="participant-score della-respira"> You : <span id="user-score">0</span></p>
        </div>
    </div>
    <button id="draw-btn" class="cinzel-decorative">DRAW</button>
</body>
</html>
