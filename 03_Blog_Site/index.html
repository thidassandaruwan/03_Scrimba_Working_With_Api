<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="script.js" defer></script>
    <title>Blog Site</title>
</head>
<body>
    <header class="header">
        <nav aria-label="Main navigation">
            <ul class="nav-list">
                <li>
                    <a href="./index.html">
                        <i class="fa-solid fa-house" aria-hidden="true"></i>
                        SuperBlog
                    </a>
                </li>
                <li>
                    <button href="./createPost.html"  id="new-post-form-btn">
                        <i class="fa-solid fa-circle-plus" style="color: rgb(0, 0, 0);"></i>
                        <span id="new-post-btn-txt">New Post</span>
                    </button>
                </li>
            </ul>
        </nav>
    </header>

    <main class="site-content">
        <div id="form-container" class="hidden">
            <form id="new-post-form">
                <div class="form-group">
                    <label for="title">Title</label>
                    <input
                        type="text"
                        id="title"
                        name="title"
                        placeholder="Enter article title..."
                        required
                    >
                </div>
                <div class="form-group">
                    <label for="content">Article Content</label>
                    <textarea
                        id="content"
                        name="body"
                        rows="6"
                        placeholder="Write your article here..."
                        required
                    ></textarea>
                </div>
                <button id="submit-btn">Creat Post</button>
                <p id="form-status" aria-live="polite"></p>
            </form>
        </div>
        <div id="article-container">

        </div>
    </main>

    <footer class="site-footer">
        <p>&copy; <span id="copyright-date">2026</span> Unknown Developer. All rights reserved.</p>
    </footer>
</body>
</html>
